# Met à jour la liste des publications, puis publie le site sur GitHub Pages.
# - à chaque « git push » sur main (par exemple après une correction faite à la main)
# - le 1er de chaque mois : cherche les nouvelles publications (PubMed, OpenAlex, ORCID)
# - à la demande : onglet Actions → Publier → Run workflow
name: Publier
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publier
  cancel-in-progress: false
jobs:
  collecter:
    # la collecte ne tourne qu'une fois par mois ou à la demande, pas à chaque correction
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python outils/collecter.py
      - name: Enregistrer les nouveautés
        run: |
          git add donnees/publications.csv
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publications : mise à jour automatique"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  publier:
    needs: collecter
    # publié même si la collecte a échoué (source injoignable) : le site garde alors la liste actuelle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # avec les nouveautés qui viennent d'être enregistrées
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
