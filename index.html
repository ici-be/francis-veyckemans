<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Francis Veyckemans — Publications</title>
  <meta name="description" content="Archives des travaux de Francis Veyckemans en anesthésie pédiatrique : publications scientifiques.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d6b70'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='white' text-anchor='middle'%3EFV%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="entete">
    <div class="largeur">
      <p class="nom"><a href="./">Francis Veyckemans</a> <span>Anesthésie pédiatrique · archives</span></p>
      <nav class="onglets" aria-label="Sections">
        <a href="./" aria-current="page">Publications</a>
        <a href="themes.html">Thèmes</a>
        <a href="lectures.html">Lectures commentées</a>
        <a href="coauteurs.html">Coauteurs</a>
        <a href="conferences.html">Conférences</a>
        <a href="medias.html">Vidéos et podcasts</a>
        <a href="maladies-rares.html">Maladies rares</a>
        <a href="liens.html">Liens</a>
      </nav>
    </div>
  </header>

  <main class="largeur">
    <h1 class="cache">Publications</h1>

    <section class="cadre annees" aria-label="Publications par année">
      <div id="periodes" class="periodes" hidden></div>
      <div id="graphique" class="graphique" role="img" aria-label="Nombre de publications par année"></div>
      <p class="aide">Cliquer sur une barre ou une période pour filtrer la liste.</p>
    </section>

    <section class="filtres" aria-label="Filtres">
      <label class="champ recherche">
        <span>Rechercher</span>
        <input type="search" id="recherche" placeholder="titre, auteur, revue, mot…" autocomplete="off">
      </label>
      <label class="champ">
        <span>Type</span>
        <select id="type"><option value="">Tous les types</option></select>
      </label>
      <label class="case"><input type="checkbox" id="pdf"> avec PDF librement accessible <span class="nb" id="nb-pdf"></span></label>
    </section>

    <div class="compte-ligne">
      <p class="compte" id="compte" aria-live="polite">Chargement…</p>
      <div id="choix" class="choix"></div>
      <div id="exporter" class="exporter" hidden>
        Exporter la sélection :
        <button type="button" class="lien-bouton" data-format="BibTeX">BibTeX</button>
        <button type="button" class="lien-bouton" data-format="RIS">RIS</button>
      </div>
    </div>

    <div class="tableau-cadre">
      <table class="tableau" id="tableau">
        <thead>
          <tr>
            <th scope="col" data-tri="annee" class="col-annee"><button type="button">Année</button></th>
            <th scope="col" data-tri="titre"><button type="button">Titre et auteurs</button></th>
            <th scope="col" data-tri="revue" class="col-revue"><button type="button">Revue</button></th>
            <th scope="col" data-tri="type" class="col-type"><button type="button">Type</button></th>
            <th scope="col" data-tri="citations" class="col-citations"><button type="button" title="Nombre de citations selon OpenAlex">Citations</button></th>
            <th scope="col" class="col-liens">Liens</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>


  <div id="infobulle" class="infobulle" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="config.js"></script>
  <script src="commun.js"></script>
  <script src="app.js"></script>
</body>
</html>
