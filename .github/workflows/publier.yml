# Cherche les nouvelles publications, puis publie le site sur GitHub Pages.
# - à chaque « git push » sur main : publie seulement
# - chaque lundi : cherche les nouvelles publications (PubMed, OpenAlex, ORCID, BnF, SUDOC), les envoie au
#   tableau Google Sheets et garde une copie du tableau dans donnees/publications.csv
#   (la collecte s'arrête si une colonne ou beaucoup de lignes ont disparu du tableau depuis la copie ;
#   si c'est voulu, la relancer à la main en cochant « accepter les suppressions »)
# - à la demande : onglet Actions → Publier → Run workflow
# Les corrections faites dans le tableau sont visibles tout de suite : le site lit le tableau en direct.
# Secrets nécessaires (Settings → Secrets and variables → Actions) : ARCHIVES_URL et ARCHIVES_CLE.
name: Publier
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      accepter_suppressions:
        description: Accepter les colonnes ou lignes supprimées du tableau depuis la dernière copie
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publier
  cancel-in-progress: false
jobs:
  collecter:
    # la collecte ne tourne qu'une fois par semaine ou à la demande, pas à chaque push
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python outils/collecter.py
        env:
          ARCHIVES_URL: ${{ secrets.ARCHIVES_URL }}
          ARCHIVES_CLE: ${{ secrets.ARCHIVES_CLE }}
          ACCEPTER_SUPPRESSIONS: ${{ inputs.accepter_suppressions && '1' || '' }}
      - name: Enregistrer les nouveautés
        run: |
          # tout ce que la collecte écrit : un fichier modifié mais pas ajouté bloquerait « git pull --rebase »
          git add donnees medias
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publications : copie du tableau, citations, coauteurs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  publier:
    needs: collecter
    # publié même si la collecte a échoué (source injoignable) : le site garde alors la liste actuelle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # avec les nouveautés qui viennent d'être enregistrées
      # un nom par tentative : « Re-run » ne bute pas sur l'archive de la tentative précédente
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}
      - id: deploiement
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
